<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5e9f2">
<title>のびのびアバター</title>
<style>
:root{color-scheme:light;--ink:#342b3a;--pink:#e66ba5;--pale:#fff7fc;--line:#ead8e6;--muted:#806f80}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff4fa,#f1f2ff);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(100% - 28px,620px);margin:24px auto 40px}.hero{text-align:center;padding:10px 0 18px}.eyebrow{font-size:.8rem;letter-spacing:.12em;color:var(--muted);font-weight:800}.hero h1{font-size:clamp(2rem,8vw,3rem);margin:.25rem 0}.hero p{margin:0;color:var(--muted)}
.card{background:#ffffffd9;border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 8px 30px #6b46630c}
h2{font-size:1.05rem;margin:0 0 12px}.choices{display:flex;gap:10px}.choice{flex:1}.btn{font:inherit;font-weight:800;border:1px solid var(--line);border-radius:13px;padding:12px 15px;background:white;color:var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s}.btn:active{transform:scale(.98)}.btn:focus-visible{outline:3px solid #b68ae6;outline-offset:2px}.choice[aria-pressed=true]{border:2px solid var(--pink);background:#fff0f7}.primary{background:var(--pink);color:white;border-color:var(--pink)}.full{width:100%;margin-top:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{text-align:center;padding:14px 8px}.stat small{color:var(--muted);font-weight:700}.value{font-size:2.25rem;font-weight:900;line-height:1.25}.unit{font-size:1rem}.stage{min-height:270px;max-height:55vh;overflow:auto;display:flex;align-items:flex-end;justify-content:center;padding:22px 12px;background:linear-gradient(#f9f4ff,#fff7fb);border:1px dashed #e4cfe2;border-radius:16px}.avatar{display:flex;flex-direction:column;align-items:center;width:min(100%,240px);transform-origin:bottom center}.part{display:block;width:min(100%,190px);height:auto;object-fit:contain;flex-shrink:0}.middle-stack{display:flex;flex-direction:column;align-items:center;width:100%;gap:0}.middle-stack img{width:min(100%,190px);height:auto;display:block}.fallback{width:100%;display:flex;justify-content:center;align-items:center;text-align:center;font-weight:800;color:#8a6286;background:#f4ddeb;border:1px dashed #cc9cbd;min-height:52px}.avatar-name{font-weight:850;margin-bottom:10px}.hint,.log{font-size:.88rem;color:var(--muted);text-align:center}.progress{height:8px;background:#f0dfec;border-radius:9px;overflow:hidden;margin:12px 0 4px}.progress div{height:100%;width:99%;background:var(--pink);transition:width .2s}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions .btn{margin-top:8px}.top-actions{margin:0 0 14px}.stage{height:clamp(300px,48vh,440px);min-height:300px;max-height:none;align-items:flex-end;overflow:hidden}.stage .avatar{flex-shrink:0;will-change:transform;transform-origin:bottom center}.hidden{display:none!important}.result-title{font-size:1.7rem;font-weight:900;text-align:center}.result-text{text-align:center;font-weight:750;margin:6px 0 16px}.comparison{margin:14px 0 6px;padding:14px 12px;text-align:center;background:#fff0f7;border:1px solid #f0c9df;border-radius:16px}.comparison small{display:block;color:var(--muted);font-weight:750}.comparison strong{display:block;font-size:1.15rem;margin-top:4px}.comparison p{margin:4px 0 0;font-size:.86rem;color:var(--muted)}.note{font-size:.83rem;color:var(--muted);line-height:1.6}.footer{text-align:center;font-size:.8rem;color:var(--muted);margin-top:20px}
@media(max-width:420px){main{width:min(100% - 18px,620px);margin-top:12px}.card{padding:14px}.stage{height:300px;min-height:300px}.value{font-size:1.9rem}.btn{padding:11px 9px}}
</style>
</head>
<body>
<main>
<header class="hero"><h1>のびのびアバター</h1><p>どこまで伸ばせる？ 限界を見極めよう！</p></header>
<section id="select-screen" class="card">
<h2>どっちを伸ばす？</h2>
<div class="choices"><button class="btn choice" data-char="kipfel" aria-pressed="true">キプフェル</button><button class="btn choice" data-char="nemesis" aria-pressed="false">ネメシス</button></div>
<button id="start" class="btn primary full">ゲームスタート</button>
<p class="note">「もっと伸ばす！」で成功すると1mずつ伸びるよ。失敗する前に「完成！」を選ぼう！</p>
</section>
<section id="game-screen" class="hidden">
<div class="stats"><div class="card stat"><small>現在の長さ</small><div class="value"><span id="height">1</span><span class="unit"> m</span></div></div><div class="card stat"><small>次の成功率</small><div class="value"><span id="rate">99</span><span class="unit">%</span></div></div></div>
<div class="card"><div id="avatar-name" class="avatar-name">キプフェル</div><div class="actions top-actions"><button id="stretch" class="btn primary">もっと伸ばす！</button><button id="finish" class="btn">完成！</button></div><div class="stage" id="stage"></div><div class="progress"><div id="meter"></div></div><p class="hint">上半身・胴体・下半身を積み重ねて伸びるよ</p><p id="log" class="log" aria-live="polite">準備はいい？</p><button id="back" class="btn full">アバター選択に戻る</button></div>
</section>
<section id="result-screen" class="card hidden"><div id="result-title" class="result-title">完成！</div><p id="result-text" class="result-text"></p><div class="stage" id="result-stage"></div><div class="stat"><small>今回の記録</small><div class="value"><span id="record">1</span><span class="unit"> m</span></div></div><div id="comparison" class="comparison hidden" aria-live="polite"><small>この長さは…</small><strong id="comparison-text"></strong><p id="comparison-detail"></p></div><div class="actions share-actions"><button id="share-image" class="btn primary">画像付きでシェア</button><button id="save-image" class="btn">画像を保存</button><button id="post-x" class="btn">Xに投稿する</button><button id="copy" class="btn">結果をテキストとしてコピー</button></div><p id="copy-status" class="hint" aria-live="polite"></p><button id="retry" class="btn full">もう一度遊ぶ</button><button id="change" class="btn full">アバターを選び直す</button></section>
<footer class="footer">のびのびアバター · 赤糸の裁縫箱</footer>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const characters = {
    kipfel:{name:"キプフェル",files:{up:"images/kipfel_up.png",middle:"images/kipfel_middle.png",down:"images/kipfel_down.png"}},
    nemesis:{name:"ネメシス",files:{up:"images/nemesis_up.png",middle:"images/nemesis_middle.png",down:"images/nemesis_down.png"}}
  };
  let selected="kipfel", height=1, rate=99, playing=false, collapsed=false, lastMessage="";
  const baseRate=85;
  // 比較対象は概算。100mを超えた場合は比較表示を行わない。
  const comparisons=[
    {m:1,label:"ギターの長さ",size:1},
    {m:1.7,label:"成人の身長",size:1.7},
    {m:5,label:"キリンの高さ",size:5},
    {m:10,label:"路線バス1台分",size:10},
    {m:18,label:"6階建てビルの高さ",size:18},
    {m:25,label:"新幹線の車両の長さ",size:25},
    {m:50,label:"凱旋門の高さ",size:50},
    {m:100,label:"牛久大仏の高さ",size:100}
  ];
  function getComparison(m){
    if(m>100)return null;
    const options=comparisons.filter(x=>x.size<=m);
    const ref=options[options.length-1]||comparisons[0];
    const ratio=m/ref.size;
    const text=ratio<1.12?`${ref.label}と同じ長さ！`:`${ref.label}の約${ratio.toFixed(1)}倍！`;
    return {text,detail:`比較対象の目安：約${ref.size}m`,label:text};
  }
  function updateComparison(m){
    const comparison=getComparison(m);
    $("comparison").classList.toggle("hidden",!comparison);
    $("comparison-text").textContent=comparison?comparison.text:"";
    $("comparison-detail").textContent=comparison?comparison.detail:"";
    return comparison;
  }
  function show(id){["select-screen","game-screen","result-screen"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
  function makePart(src,label,cls){
    const img=document.createElement("img"); img.className="part "+(cls||""); img.src=src; img.alt=label; img.draggable=false;
    img.onerror=()=>{const fallback=document.createElement("div");fallback.className="fallback";fallback.textContent=label+"画像を配置してください";img.replaceWith(fallback)};
    return img;
  }
  function makeAvatar(stage, h, minimal=false){
    const c=characters[selected], avatar=document.createElement("div");avatar.className="avatar";
    avatar.dataset.character=selected;
    const up=makePart(c.files.up,"上半身","");
    const stack=document.createElement("div");stack.className="middle-stack";
    const down=makePart(c.files.down,"下半身","");
    avatar.append(up,stack,down);
    avatar._stack=stack; avatar._up=up; avatar._down=down; avatar._minimal=minimal;
    updateAvatarParts(avatar,h,minimal);
    return avatar;
  }
  function updateAvatarParts(avatar,h,minimal=false){
    const stack=avatar._stack;
    // 失敗リザルトは胴体を取り除き、上半身＋下半身だけの最小状態にする。
    const targetCount=minimal?0:h;
    while(stack.children.length>targetCount) stack.lastElementChild.remove();
    while(stack.children.length<targetCount){
      stack.appendChild(makePart(characters[selected].files.middle,"胴体",""));
    }
    avatar._minimal=minimal;
  }
  function fitAvatar(stage, avatar){
    const style=getComputedStyle(stage);
    const available=stage.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);
    // offsetHeight は transform の影響を受けない。レイアウト確定後に1回だけ縮尺を更新する。
    const naturalHeight=avatar.offsetHeight;
    const scale=naturalHeight>0?Math.min(1,available/naturalHeight):1;
    avatar.style.transform=`scale(${scale})`;
    avatar.style.visibility="visible";
  }
  function putAvatar(stageId, h, minimal=false){
    const stage=$(stageId);
    let avatar=stage.querySelector(".avatar");
    if(!avatar || avatar.dataset.character!==selected){
      avatar=makeAvatar(stage,h,minimal);
      avatar.style.visibility="hidden";
      stage.replaceChildren(avatar);
    } else {
      updateAvatarParts(avatar,h,minimal);
    }
    let queued=false;
    const fit=()=>{
      if(queued)return; queued=true;
      requestAnimationFrame(()=>{queued=false;fitAvatar(stage,avatar)});
    };
    // 既存の画像DOMを使い回すので、伸ばすたびに全画像が再読込・点滅しない。
    avatar.addEventListener("load",fit,true);
    avatar.addEventListener("error",fit,true);
    fit();
    return avatar;
  }
  function render(){
    $("height").textContent=height;$("rate").textContent=Number(rate.toFixed(1));
    $("meter").style.width=rate+"%";$("avatar-name").textContent=characters[selected].name;
    putAvatar("stage",height);
    $("stretch").textContent="もっと伸ばす！（"+Number(rate.toFixed(1))+"%）";
  }
  function start(){
    height=1;rate=99;playing=true;collapsed=false;lastMessage="";
    $("log").textContent="伸ばす準備はOK！";$("copy-status").textContent="";
    show("game-screen");render();
  }
  function finish(failed){
    if(!playing)return;playing=false;collapsed=failed;
    $("result-title").textContent=failed?"縮んでしまった…":"完成！";
    $("result-text").textContent=failed?characters[selected].name+"は"+height+"mで縮んでしまった！":characters[selected].name+"を"+height+"m伸ばした！";
    $("record").textContent=height;
    const comparison=updateComparison(height);
    putAvatar("result-stage",height,failed);
    const gameUrl=window.location.href.split("#")[0];
    const comparisonMessage=comparison?"\n"+comparison.text+"（"+comparison.detail+"）":"";
    lastMessage=(failed?"のびのびアバター："+characters[selected].name+"を"+height+"mまで伸ばしたけど、縮んでしまった…":"のびのびアバター："+characters[selected].name+"を"+height+"m伸ばした！")+comparisonMessage+"\n#のびのびアバター\n"+gameUrl;
    $("copy-status").textContent="";show("result-screen");
  }
  function stretch(){
    if(!playing)return;
    if(Math.random()*100>=rate){finish(true);return}
    height++;
    // 元コードに合わせ、成功後は基礎成功率85%＋高さによる補正＋0〜5%のランダム幅（上限99%）。
    const heightBonus=(100-baseRate)/Math.sqrt(height);
    const randomBonus=Math.random()*5;
    rate=Math.min(99,Math.floor((baseRate+heightBonus+randomBonus)*100)/100);
    $("log").textContent="成功！ "+height+"mまで伸びた！";
    render();
  }
  document.querySelectorAll("[data-char]").forEach(b=>b.addEventListener("click",()=>{
    selected=b.dataset.char;
    document.querySelectorAll("[data-char]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  }));
  $("start").addEventListener("click",start);
  $("stretch").addEventListener("click",stretch);
  $("finish").addEventListener("click",()=>finish(false));
  $("back").addEventListener("click",()=>{playing=false;show("select-screen")});
  $("retry").addEventListener("click",start);
  $("change").addEventListener("click",()=>show("select-screen"));
  async function makeResultImageBlob(){
    const avatar=$("result-stage").querySelector(".avatar");
    if(!avatar) throw new Error("結果画像が見つかりません");
    const parts=[];
    const addPart=node=>{
      if(!node)return;
      if(node.tagName==="IMG"){
        if(!node.complete){return new Promise(resolve=>{node.addEventListener("load",resolve,{once:true});node.addEventListener("error",resolve,{once:true})}).then(()=>addPart(node));}
        if(node.naturalWidth>0){const w=190,h=node.naturalHeight/node.naturalWidth*w;parts.push({img:node,w,h});return;}
      }
      parts.push({label:node.textContent||"アバター",w:190,h:64});
    };
    for(const node of avatar.children){
      if(node.classList.contains("middle-stack")){
        for(const part of node.children) await addPart(part);
      }else await addPart(node);
    }
    const totalPartsHeight=parts.reduce((sum,p)=>sum+p.h,0);
    const H=Math.max(650,160+totalPartsHeight+220), W=450;
    const canvas=document.createElement("canvas");canvas.width=W*2;canvas.height=H*2;
    const ctx=canvas.getContext("2d");ctx.scale(2,2);
    ctx.fillStyle="#fff4fa";ctx.fillRect(0,0,W,H);
    const grad=ctx.createLinearGradient(0,0,W,H);grad.addColorStop(0,"#fff4fa");grad.addColorStop(1,"#f1f2ff");ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#342b3a";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.font="800 30px system-ui, sans-serif";ctx.fillText("のびのびアバター",W/2,48);
    ctx.font="700 18px system-ui, sans-serif";ctx.fillStyle="#806f80";ctx.fillText(characters[selected].name+" の記録",W/2,83);
    const startY=118, bottomY=H-130;
    const available=bottomY-startY;
    const scale=Math.min(1,available/Math.max(totalPartsHeight,1));
    let y=bottomY-totalPartsHeight*scale;
    for(const part of parts){
      const w=part.w*scale,h=part.h*scale,x=(W-w)/2;
      if(part.img)ctx.drawImage(part.img,x,y,w,h);
      else{
        ctx.fillStyle="#f4ddeb";ctx.fillRect(x,y,w,h);ctx.strokeStyle="#cc9cbd";ctx.strokeRect(x,y,w,h);
        ctx.fillStyle="#8a6286";ctx.font="700 13px system-ui, sans-serif";ctx.fillText(part.label.slice(0,20),W/2,y+h/2);
      }
      y+=h;
    }
    ctx.fillStyle="#e66ba5";ctx.fillRect(24,H-138,W-48,2);
    ctx.fillStyle="#342b3a";ctx.font="900 38px system-ui, sans-serif";ctx.fillText(height+"m",W/2,H-105);
    const comparison=getComparison(height);
    if(comparison){
      ctx.fillStyle="#342b3a";ctx.font="800 15px system-ui, sans-serif";ctx.fillText(comparison.text,W/2,H-70,{maxWidth:W-30});
      ctx.fillStyle="#806f80";ctx.font="600 11px system-ui, sans-serif";ctx.fillText(comparison.detail,W/2,H-49);
    }
    ctx.fillStyle="#806f80";ctx.font="700 13px system-ui, sans-serif";ctx.fillText("#のびのびアバター",W/2,H-27);
    ctx.font="600 11px system-ui, sans-serif";ctx.fillText("赤糸の裁縫箱",W/2,H-10);
    return await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error("画像の生成に失敗しました")),"image/png"));
  }
  function downloadBlob(blob,filename){
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
  }
  async function getResultFile(){
    const blob=await makeResultImageBlob();
    return new File([blob],"nobinobi-avatar-result.png",{type:"image/png"});
  }
  $("save-image").addEventListener("click",async()=>{
    try{const file=await getResultFile();downloadBlob(file,"nobinobi-avatar-result.png");$("copy-status").textContent="結果画像を保存しました！";}
    catch(e){$("copy-status").textContent="画像を作成できませんでした。もう一度お試しください。";}
  });
  $("share-image").addEventListener("click",async()=>{
    const btn=$("share-image");btn.disabled=true;
    try{
      const file=await getResultFile();
      const shareData={files:[file],title:"のびのびアバターの結果",text:lastMessage};
      if(navigator.share && navigator.canShare && navigator.canShare({files:shareData.files})){
        await navigator.share(shareData);
        $("copy-status").textContent="共有メニューを開きました。共有先で内容を確認してね。";
      }else{
        downloadBlob(file,"nobinobi-avatar-result.png");
        $("copy-status").textContent="この環境では画像の直接共有に対応していないため、画像を保存しました。Xに投稿するボタンから投稿文を開き、保存した画像を添付してください。";
      }
    }catch(e){
      if(e && e.name==="AbortError")$("copy-status").textContent="共有をキャンセルしました。";
      else $("copy-status").textContent="共有できませんでした。『画像を保存』から保存してお試しください。";
    }finally{btn.disabled=false;}
  });
  $("post-x").addEventListener("click",()=>{
    const gameUrl=window.location.href.split("#")[0];
    const resultText=lastMessage.replace("\n#のびのびアバター\n"+gameUrl, "");
    const intent="https://twitter.com/intent/tweet?"+new URLSearchParams({text:resultText+"\n#のびのびアバター",url:gameUrl}).toString();
    window.open(intent,"_blank","noopener,noreferrer");
  });
  $("copy").addEventListener("click",async()=>{
    try{
      if(navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(lastMessage);
      else {const area=document.createElement("textarea");area.value=lastMessage;area.style.position="fixed";area.style.opacity="0";document.body.appendChild(area);area.select();const ok=document.execCommand("copy");area.remove();if(!ok)throw Error("copy failed")}
      $("copy-status").textContent="コピーしました！ SNSなどに貼り付けてね。";
    }catch(e){
      $("copy-status").textContent="自動コピーできませんでした。下の文章を長押し／選択してコピーしてください。";
      const area=document.createElement("textarea");area.value=lastMessage;area.readOnly=true;area.setAttribute("aria-label","結果テキスト");area.style.width="100%";area.style.minHeight="72px";area.style.marginTop="8px";$("copy-status").after(area);area.focus();area.select();
    }
  });
})();
</script>
</body>
</html>
